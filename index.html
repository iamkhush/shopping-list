<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <link rel="stylesheet" href="/static/shopping-list/styles.css?v=5">
</head>

<body>
    <div class="container">
        <!-- Connection Status Indicator -->
        <div id="connection-status" class="connection-status online">🟢 Online</div>
        <button id="check-connection-btn" class="check-connection-btn" onclick="checkConnection()"
            style="display: none;">🔄 Check Connection</button>

        <h1>Shopping List</h1>

        <div class="add-item">
            <input type="text" id="newItem" placeholder="Add new item">
            <button onclick="addNewItem()">Add</button>
        </div>

        <div class="filter-controls">
            <button id="toggleFilter" onclick="toggleUncheckedFilter()">Show Unchecked Only</button>
        </div>

        <!-- Sync Controls (shown when online and pending changes exist) -->
        <div id="sync-container" class="sync-controls" style="display: none;">
            <button id="sync-all-btn" onclick="syncAllChanges()" class="sync-btn">
                📤 Sync All Changes
            </button>
        </div>

        <ul id="shopping-list" class="shopping-list"></ul>

        <div id="edit-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
            <div style="background: white; padding: 20px; border-radius: 8px; width: 300px; max-width: 90%; display: flex; flex-direction: column; gap: 10px;">
                <h2 style="margin-top: 0;">Edit Item</h2>
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-available">
                <input type="hidden" id="edit-sorting-id">
                
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label>Name</label>
                    <input type="text" id="edit-name" style="padding: 8px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label>Coop URL</label>
                    <input type="text" id="edit-coop-url" style="padding: 8px;" placeholder="https://coop.se/...">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label>ICA URL</label>
                    <input type="text" id="edit-ica-url" style="padding: 8px;" placeholder="https://ica.se/...">
                </div>
                
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
                    <button onclick="closeEditModal()" style="padding: 8px 12px; background: #ccc; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
                    <button onclick="saveEdit()" style="padding: 8px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Save</button>
                </div>
            </div>
        </div>

        <!-- Pending Changes Section (shown when offline) -->
        <div id="pending-changes-container" class="pending-changes-section" style="display: none;">
            <div class="pending-changes-header">
                <h2>⏳ Pending Changes (<span id="pending-changes-count">0</span>)</h2>
                <p class="pending-changes-hint">These changes will be synced when you go online.</p>
            </div>
            <ul id="pending-changes-list" class="pending-changes-list"></ul>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/shopping-list/offline-db.js?v=5"></script>
    <script src="/static/shopping-list/app.js?v=5"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/shopping-list/sw.js', { scope: '/shopping-list/' }).then(function (registration) {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, function (err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>

</html>
